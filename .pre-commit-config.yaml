repos:
  # dnephin/pre-commit-golang was archived in 2023; TekWizely's fork is the
  # maintained successor. Vet/build are module-scoped (`go vet ./...`,
  # `go build ./...`) — Go tooling reasons about packages, not single files,
  # so the file-scoped variants are fragile. gofmt is per-file, so go-fmt is.
  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-fmt
      - id: go-vet-mod
      - id: go-build-mod

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.11.4
    hooks:
      - id: golangci-lint

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  # Broad-spectrum secret scanner (~160 token patterns: AWS/GCP/Stripe/
  # postgres URLs/Anthropic/OpenAI/etc). Belt-and-suspenders to
  # detect-private-key above.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
