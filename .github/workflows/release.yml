name: release

# Fires on vX.Y.Z tag push.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write          # for creating the GitHub release
  # id-token: write        # uncomment when cosign keyless signing is enabled (v0.2)

# Releases are tag-triggered; only one tag can be active at a time, so
# the concurrency group is degenerate, but keeping it explicit prevents
# accidental concurrent re-pushes of the same tag from racing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests before release
        run: go test ./...

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
