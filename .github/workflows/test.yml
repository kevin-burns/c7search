name: test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Pin to the patch declared in go.mod so a 1.26.0-cached toolchain
          # doesn't fail "module requires go >= 1.26.2" on a fresh runner.
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pin to the patch declared in go.mod so a 1.26.0-cached toolchain
          # doesn't fail "module requires go >= 1.26.2" on a fresh runner.
          go-version-file: go.mod
          cache: true
      # v7+ is required for golangci-lint v2.x — the v6 action only
      # parses v1.x version strings.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
